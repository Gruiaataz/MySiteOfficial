services:
  - type: web
    name: mysiteofficial
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mysiteofficial-db
          property: connectionString
      - key: RESEND_FROM
        value: MySiteOfficial <onboarding@resend.dev>

databases:
  - name: mysiteofficial-db
    databaseName: mysiteofficial
    user: mysiteofficial
    plan: free
    region: frankfurt
